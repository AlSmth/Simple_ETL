x-airflow: &airflow
  image: apache/airflow:2.8.1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # подключения задаются здесь, руками в UI их создавать не нужно
    AIRFLOW_CONN_POSTGRES_OPERATIONAL: postgres://app:app@postgres-data:5432/handyman
    AIRFLOW_CONN_POSTGRES_MRR: postgres://app:app@postgres-data:5432/mrr
    AIRFLOW_CONN_POSTGRES_STG: postgres://app:app@postgres-data:5432/stg
    AIRFLOW_CONN_POSTGRES_DWH: postgres://app:app@postgres-data:5432/dwh
  volumes:
    - ./dags:/opt/airflow/dags

services:
  # метаданные Airflow
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # данные: база бота (handyman) и слои mrr / stg / dwh
  postgres-data:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: handyman
    ports:
      - "5436:5432"   # отсюда же Power BI подключается к dwh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "handyman"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin --password admin --role Admin
        --firstname Admin --lastname User --email admin@example.com || true)

  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-data:
        condition: service_healthy
    command: scheduler

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@postgres-data:5432/handyman
      AGENT_DATABASE_URL: postgresql://agent_ro:agent_ro@postgres-data:5432/handyman
      AGENT_DWH_URL: postgresql://agent_ro:agent_ro@postgres-data:5432/dwh
    depends_on:
      postgres-data:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
